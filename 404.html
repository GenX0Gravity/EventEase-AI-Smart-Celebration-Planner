<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | EventEase AI</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .error-page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: linear-gradient(135deg, var(--purple-50) 0%, #fdf2f8 50%, #eff6ff 100%);
    }
    .error-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--purple-100);
    }
    .error-code {
      font-size: 72px;
      font-weight: 900;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 12px;
      font-family: var(--font-display);
    }
    .error-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-page-wrap">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Celebration Not Found</h1>
      <p class="error-desc">
        The page you are looking for doesn't exist or has moved. Let's get you back to planning your special event!
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn-primary">
          <i data-lucide="home"></i> Back to Dashboard
        </a>
      </div>
    </div>
  </div>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
